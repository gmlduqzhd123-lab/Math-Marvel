<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학 마블 - 주사위 세계여행 보드게임</title>
<style>
:root{
  --ink:#2b1d0e; --paper:#fffaf0; --gold:#ffc53d; --ok:#7ee08f; --bad:#ff8f8f;
  --t:60px; --rx:56deg; --rz:45deg;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Pretendard",sans-serif;color:var(--ink)}
body{overflow:hidden;background:linear-gradient(#bfe7ff 0%,#dff3ff 45%,#fff4d6 100%)}
button,input,select{font-family:inherit;color:inherit}
button{cursor:pointer}
.screen{display:none;position:fixed;inset:0;z-index:1}
.screen.active{display:block}
.hidden{display:none!important}

/* ---------- 배경 구름 ---------- */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg .cloud{position:absolute;background:#fff;border-radius:999px;opacity:.85;animation:drift linear infinite}
#bg .cloud::before,#bg .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
#bg .cloud::before{width:55%;height:160%;left:15%;top:-80%}
#bg .cloud::after{width:40%;height:130%;left:50%;top:-55%}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* ---------- 공통 버튼 / 패널 ---------- */
.pbtn{border:3px solid var(--ink);background:#fff3d6;font-weight:800;padding:9px 16px;border-radius:10px;box-shadow:0 4px 0 var(--ink);font-size:16px;transition:transform .08s,filter .1s;white-space:nowrap}
.pbtn:hover{filter:brightness(1.06)}
.pbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pbtn.gold{background:var(--gold)} .pbtn.ok{background:var(--ok)} .pbtn.bad{background:var(--bad)}
.pbtn.blue{background:#9fd0ff} .pbtn.pink{background:#ffb8d9} .pbtn.white{background:#fff}
.pbtn.big{font-size:24px;padding:14px 40px;border-radius:14px;box-shadow:0 6px 0 var(--ink)}
.pbtn.sm{font-size:13px;padding:5px 10px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
.pbtn:disabled{opacity:.45;cursor:default;transform:none;filter:none}
.panel{background:rgba(255,250,240,.97);border:3px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 rgba(43,29,14,.85);padding:18px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 .12em;font-size:.92em}
.fr span:first-child{border-bottom:.09em solid currentColor;padding:0 .18em}

/* ---------- 타이틀 ---------- */
#screen-title{display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:20px}
#screen-title.active{display:flex}
.logo{font-size:clamp(52px,9vw,110px);font-weight:900;line-height:1.05;color:#ffd23f;letter-spacing:-1px;
  text-shadow:5px 0 var(--ink),-5px 0 var(--ink),0 5px var(--ink),0 -5px var(--ink),5px 5px var(--ink),-5px 5px var(--ink),5px -5px var(--ink),-5px -5px var(--ink),0 12px 0 #3d8bff}
.logo .l2{color:#ff7a59}
.subtitle{font-size:clamp(16px,2.2vw,22px);font-weight:800;background:rgba(255,250,240,.9);border:3px solid var(--ink);border-radius:999px;padding:8px 22px}
.title-chars{font-size:clamp(34px,5vw,56px);display:flex;gap:14px}
.title-chars span{display:inline-block;animation:bob 1.6s ease-in-out infinite}
.title-btns{display:flex;flex-direction:column;gap:14px;min-width:300px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ---------- 설정 ---------- */
#screen-setup{overflow:auto}
#screen-setup.active{display:flex;justify-content:center;align-items:flex-start;padding:24px 12px}
.setup{width:min(880px,100%)}
.setup h2{margin:0 0 14px;font-size:30px;text-align:center}
.srow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0}
.srow>label{font-weight:900;min-width:110px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.seg button.on{background:var(--gold);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px;border:3px solid var(--c);border-radius:12px;margin:8px 0;background:var(--l)}
.prow .tnum{background:var(--c);color:#fff;font-weight:900;border-radius:8px;padding:4px 10px;border:2px solid var(--ink)}
.prow input{border:2px solid var(--ink);border-radius:8px;padding:6px 10px;font-size:16px;font-weight:800;width:130px}
.chars{display:flex;gap:4px;flex-wrap:wrap}
.chars button{font-size:24px;border:2px solid transparent;background:none;border-radius:10px;padding:2px 4px;line-height:1.1}
.chars button.on{border-color:var(--ink);background:#fff}
.setup .foot{display:flex;justify-content:center;gap:12px;margin-top:16px}
.hint{font-size:13px;opacity:.75}

/* ---------- 게임 화면 ---------- */
#topbar{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;gap:8px;z-index:5}
#topbar .ttl{font-weight:900;font-size:20px;min-width:150px}
#topbar .mid{display:flex;gap:8px}
#topbar .info{font-weight:900;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:4px 16px;font-size:16px}
#topbar .tools{display:flex;gap:6px}
#stage{position:absolute;left:0;right:0;top:54px;bottom:0;display:flex;align-items:center;justify-content:center;perspective:2400px;perspective-origin:50% 45%;z-index:1}
#board{position:relative;width:calc(var(--t)*9);height:calc(var(--t)*9);transform-style:preserve-3d;
  transform:translateY(calc(var(--t)*-.8)) rotateX(var(--rx)) rotateZ(var(--rz));transition:transform .9s cubic-bezier(.3,.8,.3,1);
  background:#8a5a32;border-radius:6px}
.side{position:absolute}
.side.s1{left:0;top:100%;width:100%;height:calc(var(--t)*.34);transform-origin:top;transform:rotateX(-90deg);background:linear-gradient(#9b6a3c,#6e4524)}
.side.s2{top:0;left:100%;height:100%;width:calc(var(--t)*.34);transform-origin:left;transform:rotateY(90deg);background:linear-gradient(90deg,#8a5a30,#5e3b1d)}
.side.s3{left:0;bottom:100%;width:100%;height:calc(var(--t)*.34);transform-origin:bottom;transform:rotateX(90deg);background:#7a4f2a}
.side.s4{top:0;right:100%;height:100%;width:calc(var(--t)*.34);transform-origin:right;transform:rotateY(-90deg);background:#7a4f2a}

/* 칸 = 두께 있는 블록 */
.tile{position:absolute;width:var(--t);height:var(--t);transform-style:preserve-3d;cursor:pointer;--th:calc(var(--t)*.16);--sd:#cdb88f;--sd2:#b39c70}
.tface{position:absolute;inset:0;transform:translateZ(var(--th));border:2px solid #6b4a2a;background:#fffaf0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  overflow:hidden;text-align:center;font-weight:900;line-height:1.1;transition:background .3s}
.tside{position:absolute;background:var(--sd)}
.tside.a{left:0;top:100%;width:100%;height:var(--th);transform-origin:top;transform:translateZ(var(--th)) rotateX(-90deg);background:var(--sd)}
.tside.b{top:0;left:100%;height:100%;width:var(--th);transform-origin:left;transform:translateZ(var(--th)) rotateY(90deg);background:var(--sd2)}
.tside.c{left:0;bottom:100%;width:100%;height:var(--th);transform-origin:bottom;transform:translateZ(var(--th)) rotateX(90deg);background:var(--sd2)}
.tside.d{top:0;right:100%;height:100%;width:var(--th);transform-origin:right;transform:translateZ(var(--th)) rotateY(-90deg);background:var(--sd)}
.tface .band{width:100%;height:26%;display:flex;align-items:center;justify-content:center;font-size:calc(var(--t)*.16);color:#2b1d0e;border-bottom:2px solid #6b4a2a;flex-shrink:0}
.tface .tname{font-size:calc(var(--t)*.155);margin-top:5%;letter-spacing:-.5px;white-space:nowrap}
.tface .tname.long{font-size:calc(var(--t)*.125)}
.tface .tname.xlong{font-size:calc(var(--t)*.1)}
.tface .tprice{font-size:calc(var(--t)*.125);margin-top:3%;opacity:.8}
.tface .own{position:absolute;right:3px;bottom:3px;min-width:calc(var(--t)*.24);height:calc(var(--t)*.24);border-radius:50%;color:#fff;font-size:calc(var(--t)*.15);display:flex;align-items:center;justify-content:center;border:2px solid var(--ink)}
.tile.owned .tface{border-width:calc(var(--t)*.06)}
.tile.owned .tface .tprice{opacity:1;font-size:calc(var(--t)*.12)}
.tile.corner .tface{justify-content:center;background:#ffe7a3}
.tile.corner .cic{font-size:calc(var(--t)*.34)}
.tile.corner .cnm{font-size:calc(var(--t)*.15)}
.tile.corner .csub{font-size:calc(var(--t)*.105);opacity:.8}
.tile.key .tface{justify-content:center;background:#fff1b8}
.tile.key .cic{font-size:calc(var(--t)*.32)}
.tile.key .cnm{font-size:calc(var(--t)*.13)}
.tile.flash .tface{animation:tflash .9s ease}
@keyframes tflash{0%,100%{filter:none}40%{filter:brightness(1.25) drop-shadow(0 0 8px #ffe14d)}}
.tile.pick .tface{animation:pick 1s ease-in-out infinite}
@keyframes pick{0%,100%{box-shadow:inset 0 0 0 3px #3d8bff}50%{box-shadow:inset 0 0 0 calc(var(--t)*.12) #3d8bff}}
#center{position:absolute;left:var(--t);top:var(--t);width:calc(var(--t)*7);height:calc(var(--t)*7);display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,#7a5636 0%,#5f4128 75%);box-shadow:inset 0 0 calc(var(--t)*.5) rgba(0,0,0,.45);pointer-events:none}
#center .clogo{font-size:calc(var(--t)*1.05);font-weight:900;color:rgba(255,240,210,.16);line-height:1;letter-spacing:-2px;transform:translateY(calc(var(--t)*-1.6))}

/* 판 가운데 조작부 (화면에 붙어 있는 HTML) */
#hud{position:absolute;left:50%;top:calc(50% - var(--t)*.7);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:calc(var(--t)*.12);z-index:3;pointer-events:none}
#hud>*{pointer-events:auto}
#msg{background:rgba(43,29,14,.82);color:#fff;border-radius:999px;padding:7px 18px;font-weight:800;font-size:clamp(14px,calc(var(--t)*.2),19px);display:flex;align-items:center;gap:8px;max-width:calc(var(--t)*7.5);text-align:center}
#msg .me{font-size:1.5em}
.drow{display:flex;align-items:center;gap:calc(var(--t)*.25)}
.die{width:52px;height:52px;position:relative;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.2,.8,.3,1)}
.dwrap{perspective:500px}
.face{position:absolute;inset:0;background:#fff;border:3px solid var(--ink);border-radius:10px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5px}
.face i{width:9px;height:9px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.face i.v{visibility:visible}
.face.f1 i.v{background:#e53935;width:13px;height:13px}
.f1{transform:translateZ(26px)} .f6{transform:rotateY(180deg) translateZ(26px)}
.f3{transform:rotateY(90deg) translateZ(26px)} .f4{transform:rotateY(-90deg) translateZ(26px)}
.f2{transform:rotateX(90deg) translateZ(26px)} .f5{transform:rotateX(-90deg) translateZ(26px)}
#rollBtn{width:clamp(88px,calc(var(--t)*1.35),120px);height:clamp(88px,calc(var(--t)*1.35),120px);border-radius:50%;border:4px solid var(--ink);
  background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc53d 55%,#e08a00);box-shadow:0 6px 0 var(--ink),0 0 0 6px rgba(255,255,255,.35);
  font-weight:900;font-size:clamp(17px,calc(var(--t)*.24),22px);line-height:1.15;transition:transform .08s}
#rollBtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
#rollBtn:disabled{filter:grayscale(.8);opacity:.6;cursor:default;transform:none}
#rollBtn:not(:disabled){animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 0 var(--ink),0 0 0 6px rgba(255,255,255,.35)}50%{box-shadow:0 6px 0 var(--ink),0 0 0 14px rgba(255,214,80,.45)}}
#dsum{font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 var(--ink);min-height:24px}

/* 빌보드 (항상 화면을 향해 서 있는 요소) */
.anchor{position:absolute;width:0;height:0;transform-style:preserve-3d;pointer-events:none;transform:translateZ(calc(var(--t)*.16))}
.bb{position:absolute;transform-origin:50% 100%;transform:rotateZ(calc(var(--rz) * -1)) rotateX(calc(var(--rx) * -1));transition:transform .9s cubic-bezier(.3,.8,.3,1);pointer-events:none}
.token{transition:left .22s ease-out,top .22s ease-out}
.token.fly{transition:left .75s ease-in-out,top .75s ease-in-out}
.token .shadow{position:absolute;left:calc(var(--t)*-.2);top:calc(var(--t)*-.2);width:calc(var(--t)*.4);height:calc(var(--t)*.4);border-radius:50%;transform:translateZ(1px);opacity:.75;border:2px solid var(--ink)}
.token .stand{left:calc(var(--t)*-.4);top:calc(var(--t)*-1.15);width:calc(var(--t)*.8);height:calc(var(--t)*1.15);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.token .body{display:flex;flex-direction:column;align-items:center}
.token .emo{font-size:calc(var(--t)*.6);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
.token .ped{min-width:calc(var(--t)*.46);height:calc(var(--t)*.2);border-radius:999px;border:2px solid var(--ink);margin-top:-5px;color:#fff;font-weight:900;font-size:calc(var(--t)*.14);display:flex;align-items:center;justify-content:center;padding:0 4px}
.token .arrow{font-size:calc(var(--t)*.3);line-height:1;color:#ff3b3b;text-shadow:0 2px 0 var(--ink);visibility:hidden;animation:bob .8s ease-in-out infinite}
.token.cur .arrow{visibility:visible}
.token .body.hop{animation:hop .22s ease-out}
.token.fly .body{animation:flyhop .75s ease-in-out}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(calc(var(--t)*-.35))}}
@keyframes flyhop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(calc(var(--t)*-2.2)) scale(1.15)}}

/* 팀 색 건물 */
.bld .stand{left:calc(var(--t)*-.3);top:calc(var(--t)*-.95);width:calc(var(--t)*.6);height:calc(var(--t)*.95);display:flex;align-items:flex-end;justify-content:center}
.bw{position:relative;animation:pop .4s ease;filter:drop-shadow(1.5px 0 0 #2b1d0e) drop-shadow(-1.5px 0 0 #2b1d0e) drop-shadow(0 1.5px 0 #2b1d0e) drop-shadow(0 -1.5px 0 #2b1d0e) drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.b-flag{width:calc(var(--t)*.36);height:calc(var(--t)*.56)}
.b-flag .pole{position:absolute;left:0;bottom:0;width:calc(var(--t)*.045);height:100%;background:#5a3d22}
.b-flag .cloth{position:absolute;left:calc(var(--t)*.045);top:0;width:calc(var(--t)*.31);height:calc(var(--t)*.24);background:var(--c);color:#fff;font-weight:900;font-size:calc(var(--t)*.16);display:flex;align-items:center;justify-content:center}
.b-house{width:calc(var(--t)*.48);height:calc(var(--t)*.46)}
.b-house .roof{position:absolute;left:0;right:0;top:0;height:50%;background:var(--c);clip-path:polygon(50% 0,100% 100%,0 100%)}
.b-house .wall{position:absolute;left:12%;right:12%;bottom:0;height:52%;background:#fff}
.b-tower{width:calc(var(--t)*.36);height:calc(var(--t)*.66);background:var(--c);display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--t)*.045);padding:calc(var(--t)*.055);align-content:start}
.b-hotel{width:calc(var(--t)*.5);height:calc(var(--t)*.84);background:var(--c);display:grid;grid-template-columns:1fr 1fr 1fr;gap:calc(var(--t)*.04);padding:calc(var(--t)*.16) calc(var(--t)*.05) calc(var(--t)*.05);align-content:start}
.b-tower i,.b-hotel i{height:calc(var(--t)*.07);background:rgba(255,255,255,.85);display:block}
.b-hotel .sign{position:absolute;left:50%;top:calc(var(--t)*-.14);transform:translateX(-50%);background:#ffd23f;font-weight:900;font-size:calc(var(--t)*.13);padding:0 4px;border-radius:4px;color:var(--ink);white-space:nowrap}
.bnum{position:absolute;left:50%;bottom:calc(var(--t)*.03);transform:translateX(-50%);width:calc(var(--t)*.2);height:calc(var(--t)*.2);border-radius:50%;background:#fff;color:var(--c);font-weight:900;font-size:calc(var(--t)*.15);display:flex;align-items:center;justify-content:center;line-height:1}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* 팀 카드 */
.pcard{position:absolute;width:230px;z-index:4;background:linear-gradient(var(--l),#fff 60%);border:4px solid var(--c);border-radius:14px;padding:0 0 8px;box-shadow:0 4px 0 var(--ink);transition:transform .2s;overflow:visible}
.pcard.cur{transform:scale(1.05);box-shadow:0 0 0 4px #fff,0 0 0 7px var(--ink),0 6px 0 var(--ink)}
.pcard.out{opacity:.45;filter:grayscale(1)}
.pcard .phead{background:var(--c);color:#fff;font-weight:900;font-size:13px;padding:3px 10px;display:flex;justify-content:space-between;border-radius:8px 8px 0 0}
.pcard .ph{display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px;padding:6px 10px 0}
.pcard .ph .pe{font-size:28px;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid var(--c);background:#fff;flex-shrink:0}
.pcard .ph .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .rank{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#ffd23f;font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pcard .money{font-size:21px;font-weight:900;padding:2px 10px 0}
.pcard .meta{font-size:12px;font-weight:700;opacity:.85;display:flex;gap:8px;flex-wrap:wrap;padding:0 10px}
.pcard .lands{display:flex;flex-wrap:wrap;gap:3px;padding:4px 8px 0;max-height:46px;overflow:hidden}
.pcard .lands span{background:var(--c);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:1px 5px;white-space:nowrap}
.pcard .float{position:absolute;right:10px;top:-10px;font-weight:900;font-size:22px;animation:floatup 1.3s ease forwards;pointer-events:none;text-shadow:2px 0 #fff,-2px 0 #fff,0 2px #fff,0 -2px #fff}
@keyframes floatup{0%{opacity:0;transform:translateY(10px)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}
#pc0{left:10px;top:62px} #pc1{right:10px;top:62px} #pc2{right:10px;bottom:12px} #pc3{left:10px;bottom:12px}

/* 모달 */
#modal{position:fixed;inset:0;z-index:20;background:rgba(30,20,10,.45);display:flex;align-items:center;justify-content:center;padding:14px}
#modal .mbox{width:min(700px,100%);max-height:94vh;overflow:auto;animation:mIn .25s ease}
@keyframes mIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
#modal h3{margin:0 0 10px;font-size:24px;text-align:center}
#modal .mbody{font-size:18px;font-weight:700;line-height:1.5;text-align:center}
#modal .mbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.ptop{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.badge{border:2px solid var(--ink);border-radius:999px;padding:3px 12px;font-weight:900;font-size:15px}
.psub{font-size:15px;font-weight:800;opacity:.8}
.pq{font-size:clamp(22px,3.4vw,32px);font-weight:900;margin:10px 0;line-height:1.45}
.pq small{font-size:.6em;opacity:.75}
.pq .en{color:#1f5fbf}
.pvis{display:flex;justify-content:center;margin:6px 0}
.pvis svg{width:min(280px,70vw);height:auto;max-height:200px}
.bigemo{font-size:90px;line-height:1.1}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice{border:3px solid var(--ink);background:#fff;border-radius:12px;padding:12px 10px;font-size:clamp(18px,2.5vw,25px);font-weight:900;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:10px;justify-content:center;min-height:64px;line-height:1.3}
.choices.long .choice{font-size:clamp(15px,2vw,19px)}
.choices.emo .choice span{font-size:48px;line-height:1}
.choice b{font-size:14px;background:var(--ink);color:#fff;border-radius:6px;padding:1px 7px;flex-shrink:0}
.choice:hover{background:#fff6d6}
.choice.right{background:var(--ok)} .choice.wrong{background:var(--bad)}
.choice:disabled{cursor:default}

<script>
/* =========================================================
   기본 도구
   ========================================================= */
const $ = s => document.querySelector(s);
const R = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => b ? gcd(b, a % b) : a;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const r10 = x => Math.round(x / 10) * 10;
function josa(word, pair) {
  const [a, b] = pair.split('/');
  const c = String(word).charCodeAt(String(word).length - 1);
  if (c < 0xAC00 || c > 0xD7A3) return word + a + '(' + b + ')';
  return word + (((c - 0xAC00) % 28) ? a : b);
}
function fmt(x, dec = 0) {
  if (dec > 0) return String(+(+x).toFixed(dec));
  return x >= 10000 ? x.toLocaleString('ko-KR') : String(x);
}

/* ---------- 보기 만들기 ---------- */
function mc(correct, wrongs) {
  const choices = shuffle([correct, ...wrongs.slice(0, 3)]);
  return { choices, ans: choices.indexOf(correct) };
}
function mcStr(correct, wrongs, filler) {
  const seen = new Set([correct]), out = [];
  for (const w of wrongs) { if (out.length < 3 && w != null && !seen.has(w)) { seen.add(w); out.push(w); } }
  let i = 0;
  while (out.length < 3 && i < 60) { const w = filler(i++); if (w != null && !seen.has(w)) { seen.add(w); out.push(w); } }
  return mc(correct, out);
}
function mcPool(correct, preferred, pool) {
  const rest = shuffle(pool.filter(x => x !== correct));
  return mcStr(correct, shuffle(preferred.slice()), i => rest[i]);
}
function mcNum(ans, { dec = 0, unit = '', extra = [], min = 0 } = {}) {
  const u = unit ? (unit === '°' ? '' : ' ') + unit : '';
  const key = v => fmt(v, dec);
  const seen = new Set([key(ans)]), wr = [];
  const push = v => {
    if (wr.length >= 3 || !isFinite(v) || v < min) return;
    v = +(+v).toFixed(dec);
    const k = key(v);
    if (seen.has(k)) return;
    seen.add(k); wr.push(v);
  };
  shuffle(extra.slice()).forEach(push);
  const step = Math.pow(10, -dec);
  const mag = ans >= 1000 ? 100 : ans >= 100 ? 10 : 1;
  shuffle([1, -1, 2, -2, 10, -10, mag, -mag, 5 * mag, -5 * mag]).forEach(o => push(ans + o * step));
  for (let i = 3; wr.length < 3 && i < 80; i++) { push(ans + i * step); push(ans - i * step); }
  return mc(key(ans) + u, wr.map(v => key(v) + u));
}

/* ---------- 영어 읽어 주기 (브라우저 내장 음성) ---------- */
const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  if (!canSpeak || !text) return;
  try {
    const s = window.speechSynthesis; s.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = .85;
    const v = s.getVoices().find(v => /^en[-_]US/i.test(v.lang)) || s.getVoices().find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    s.speak(u);
  } catch (e) {}
}

/* =========================================================
   소리 (브라우저에서 합성)
   ========================================================= */
let AC = null, muted = false;
function tone(f, d = .12, type = 'sine', v = .15, delay = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const SFX = {
  step: () => tone(660, .06, 'triangle', .1),
  roll: () => { for (let i = 0; i < 8; i++) tone(200 + Math.random() * 300, .05, 'square', .05, i * .08); },
  coin: () => { tone(988, .08, 'square', .08); tone(1319, .25, 'square', .08, .08); },
  ok: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .15, 'triangle', .14, i * .08)),
  bad: () => { tone(220, .25, 'sawtooth', .1); tone(160, .35, 'sawtooth', .1, .15); },
  key: () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, .12, 'sine', .12, i * .06)),
  toll: () => { [1568, 1319, 1568, 1976].forEach((f, i) => tone(f, .07, 'square', .06, i * .07)); tone(196, .35, 'triangle', .12, .32); },
  clink: () => tone(1800 + Math.random() * 500, .05, 'square', .04),
  fly: () => { for (let i = 0; i < 10; i++) tone(300 + i * 80, .08, 'sine', .08, i * .05); },
  build: () => [392, 523, 659].forEach((f, i) => tone(f, .12, 'square', .07, i * .07)),
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .2, 'triangle', .14, i * .12)),
};
function toggleMute() { muted = !muted; $('#muteBtn').textContent = muted ? '🔇' : '🔊'; }

/* ===== CONTENT START ===== */
/* =========================================================
   게임 내용: 수학
   ========================================================= */
const GAME = {
  title: '수학 마블', logo: ['수학', '마블'],
  subtitle: '🎲 주사위를 굴려 세계를 여행하는 초등 수학 보드게임 🌏',
  levelLabel: '학년', levels: [[1, '1~2학년'], [2, '3~4학년'], [3, '5~6학년']], defaultLevel: 2,
  topics: {
    add:   { name: '덧셈',     icon: '＋', color: '#9ee07a' },
    sub:   { name: '뺄셈',     icon: '－', color: '#72d3f0' },
    mul:   { name: '곱셈',     icon: '×',  color: '#c3a3ff' },
    div:   { name: '나눗셈',   icon: '÷',  color: '#ffaad6' },
    frac:  { name: '분수',     icon: '½',  color: '#ffb36e' },
    dec:   { name: '소수',     icon: '0.1', color: '#ffe066' },
    shape: { name: '도형',     icon: '△',  color: '#7fe3c0' },
    meas:  { name: '시계·단위', icon: '⏰', color: '#ff9a9a' },
  },
  groups: [
    { topic: 'add',   cities: ['타이베이', '방콕', '하노이'] },
    { topic: 'sub',   cities: ['싱가포르', '시드니', '도쿄'] },
    { topic: 'mul',   cities: ['카이로', '이스탄불', '아테네'] },
    { topic: 'div',   cities: ['로마', '파리', '베를린'] },
    { topic: 'frac',  cities: ['런던', '마드리드', '암스테르담'] },
    { topic: 'dec',   cities: ['뉴욕', '토론토', '상파울루'] },
    { topic: 'shape', cities: ['하와이', '밴쿠버', '멕시코시티'] },
    { topic: 'meas',  cities: ['부산', '제주', '서울'] },
  ],
  topicName(t, level) {
    if (level === 1 && t === 'dec') return '자릿값';
    if (level === 1 && t === 'div') return '똑같이 나누기';
    return this.topics[t].name;
  },
  gen(topic, level, k) { return GEN[topic](level, k); },
  rulesNote: '문제는 고른 학년에 맞춰 매번 새로 만들어져요. 같은 색 안에서 뒤쪽 도시일수록 조금 더 어려워요.',
};

const KIDS = ['민수', '지아', '하준', '서연', '도윤', '하은', '시우', '유나'];
const ITEMS = [['사과', '개'], ['구슬', '개'], ['연필', '자루'], ['사탕', '개'], ['색종이', '장'], ['스티커', '장'], ['딱지', '장'], ['귤', '개']];

const F = (n, d, w = 0) => ({ n, d, w });
function redF(n, d) { const g = gcd(n, d); n /= g; d /= g; const w = Math.floor(n / d); return { w, n: n - w * d, d }; }
function fH(f) {
  const fr = f.n ? `<span class="fr"><span>${f.n}</span><span>${f.d}</span></span>` : '';
  if (f.w && f.n) return `${f.w}${fr}`;
  if (f.w) return String(f.w);
  return f.n ? fr : '0';
}
const fVal = f => f.w + f.n / f.d;
function mcFrac(ans, wrongs, sameValueOk = false) {
  const vals = [fVal(ans)], seen = new Set([fH(ans)]), out = [];
  const tryAdd = w => {
    if (out.length >= 3 || !w || w.d <= 0 || w.n < 0 || w.w < 0) return;
    const h = fH(w), v = fVal(w);
    if (seen.has(h)) return;
    if (!sameValueOk && vals.some(x => Math.abs(x - v) < 1e-9)) return;
    if (sameValueOk && Math.abs(fVal(ans) - v) < 1e-9 && gcd(w.n, w.d) === 1) return;
    seen.add(h); vals.push(v); out.push(h);
  };
  wrongs.forEach(tryAdd);
  for (let i = 1; out.length < 3 && i < 40; i++) {
    tryAdd(F(ans.n + i, ans.d, ans.w));
    tryAdd(F(Math.max(1, ans.n), ans.d + i, ans.w));
  }
  return mc(fH(ans), out);
}

/* ---------- 그림 (SVG) ---------- */
const INK = '#2b1d0e';
function svgPie(n, m) {
  const cx = 80, cy = 80, r = 68; let s = `<svg viewBox="0 0 160 160">`;
  for (let i = 0; i < n; i++) {
    const a0 = -Math.PI / 2 + i * 2 * Math.PI / n, a1 = a0 + 2 * Math.PI / n;
    s += `<path d="M${cx},${cy} L${cx + r * Math.cos(a0)},${cy + r * Math.sin(a0)} A${r},${r} 0 0 1 ${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)} Z" fill="${i < m ? '#ffb347' : '#fff'}" stroke="${INK}" stroke-width="3"/>`;
  }
  return s + '</svg>';
}
function svgClock(h, m) {
  let s = `<svg viewBox="0 0 160 160"><circle cx="80" cy="80" r="74" fill="#fff" stroke="${INK}" stroke-width="5"/>`;
  for (let i = 0; i < 60; i++) {
    const a = i * Math.PI / 30, r1 = i % 5 ? 68 : 64;
    s += `<line x1="${80 + r1 * Math.sin(a)}" y1="${80 - r1 * Math.cos(a)}" x2="${80 + 72 * Math.sin(a)}" y2="${80 - 72 * Math.cos(a)}" stroke="${INK}" stroke-width="${i % 5 ? 1 : 3}"/>`;
  }
  for (let i = 1; i <= 12; i++) {
    const a = i * Math.PI / 6;
    s += `<text x="${80 + 52 * Math.sin(a)}" y="${80 - 52 * Math.cos(a) + 6}" text-anchor="middle" font-size="17" font-weight="800" fill="${INK}">${i}</text>`;
  }

      const h = R(1, 12), m = k === 0 ? 0 : k === 1 ? 30 : R(1, 11) * 5;
      let wr;
      if (k === 0) wr = [timeStr(nextH(h), 0), timeStr(prevH(h), 0), timeStr(12, h * 5 % 60 || 30)];
      else if (k === 1) wr = [timeStr(nextH(h), 30), timeStr(h, 0), timeStr(prevH(h), 30), timeStr(6, h * 5 % 60 || 15)];
      else wr = [timeStr(nextH(h), m), timeStr(h, m / 5), timeStr(m / 5, h * 5 % 60), timeStr(h, 60 - m)];
      return { q: '시계가 가리키는 시각은?', vis: svgClock(h, m), ...mcStr(timeStr(h, m), wr, i => timeStr((h + i + 2) % 12 + 1, m)) };
    }
    if (g === 2) {
      if (k === 0) { const a = R(1, 9), b = R(1, 99); return { q: `${a} m ${b} cm는 몇 cm일까요?`, ...mcNum(100 * a + b, { unit: 'cm', extra: [10 * a + b, 1000 * a + b, a + b] }), exp: '1 m = 100 cm' }; }
      if (k === 1) {
        const h = R(1, 10), m = R(1, 11) * 5, dm = pick([20, 25, 30, 35, 40, 45, 50]), tot = m + dm;
        let nh = h + Math.floor(tot / 60); if (nh > 12) nh -= 12;
        const nm = tot % 60;
        return { q: `${timeStr(h, m)}에서 ${dm}분이 지나면<br>몇 시 몇 분일까요?`, ...mcStr(timeStr(nh, nm), [timeStr(h, nm), tot >= 60 ? `${h}시 ${tot}분` : timeStr(nextH(nh), nm), timeStr(nh, (nm + 10) % 60), timeStr(nextH(nh), nm)], i => timeStr(nh, (nm + 5 * (i + 3)) % 60)) };
      }
      const a = R(1, 9), b = R(1, 19) * 50, kg = Math.random() < .5;
      const [U1, U2] = kg ? ['kg', 'g'] : ['L', 'mL'];
      return { q: `${a} ${U1} ${b} ${U2}는 몇 ${U2}일까요?`, ...mcNum(1000 * a + b, { unit: U2, extra: [100 * a + b, 10000 * a + b, 1000 * a + b * 10] }), exp: `1 ${U1} = 1000 ${U2}` };
    }
    if (k === 0) {
      const A = R(10, 30), d1 = R(1, 6), d2 = R(1, 6), nums = shuffle([A + d1, A - d1, A + d2, A - d2]);
      return { q: `${nums.join(', ')}의 평균은?`, ...mcNum(A, { extra: [4 * A, A + 1, A - 1] }), exp: '모두 더한 다음 개수로 나누어요.' };
    }
    if (k === 1) {
      const x = R(11, 99);
      if (Math.random() < .5) return { q: `${fmt(x / 10, 1)} km는 몇 m일까요?`, ...mcNum(x * 100, { unit: 'm', extra: [x * 10, x * 1000, x] }), exp: '1 km = 1000 m' };
      return { q: `${x * 100} m는 몇 km일까요?`, ...mcNum(x / 10, { unit: 'km', dec: 2, extra: [x, x / 100, x * 10] }), exp: '1000 m = 1 km' };
    }
    let base, p;
    do { base = pick([20, 40, 50, 60, 80, 200, 300, 400]); p = pick([10, 20, 25, 50, 75]); } while ((base * p) % 100);
    return { q: `${base}의 ${p}%는 얼마일까요?`, ...mcNum(base * p / 100, { extra: [base * p / 10, base - p, base * p / 1000] }), exp: `${base} × ${p}/100` };
  },
};

function buildTiles() {
  const tiles = [];
  for (let i = 0; i < 32; i++) {
    const side = Math.floor(i / 8), j = i % 8;
    if (j === 0) {
      tiles.push([
        { type: 'start', name: '출발', icon: '🚩', sub: `지나가면 +${SALARY}` },
        { type: 'island', name: '무인도', icon: '🏝️', sub: '2번 쉬기' },
        { type: 'fund', name: '기금', icon: '💰', sub: '기금을 모두 받아요' },
        { type: 'space', name: '우주여행', icon: '🚀', sub: '원하는 칸으로' },
      ][side]);
    } else if (j === 4) {
      tiles.push({ type: 'key', name: '황금열쇠', icon: '🔑' });
    } else {
      const g = side * 2 + (j < 4 ? 0 : 1), k = j < 4 ? j - 1 : j - 5;
      const G = GAME.groups[g];
      tiles.push({ type: 'city', name: G.cities[k], group: g, k, topic: G.topic, price: 50 + g * 30 + k * 10, owner: null, level: 0 });
    }
  }

}

function askProblem(topic, k, title, sub) {
  return new Promise(res => {
    const P = GAME.gen(topic, S.level, k), T = GAME.topics[topic], sc = P.type === 'scramble';
    const longC = !sc && P.choices.some(c => c.replace(/<[^>]+>/g, '').length > 22);
    const choicesHTML = sc
      ? `<div class="sc-ans" id="scAns"></div><div class="sc-pool" id="scPool"></div>
         <div class="mbtns" style="margin-top:6px"><button class="pbtn sm white" id="scReset">↺ 다시 놓기</button><button class="pbtn sm gold" id="scCheck" disabled>✔ 확인</button></div>`
      : `<div class="choices ${P.emo ? 'emo' : ''} ${longC ? 'long' : ''}">${P.choices.map((c, i) => `<button class="choice" data-i="${i}"><b>${i + 1}</b><span>${c}</span></button>`).join('')}</div>`;
    openModal(title, `<div class="ptop"><span class="badge" style="background:${T.color}">${T.icon} ${topicName(topic)}</span><span class="psub">${sub || ''}</span></div>
      <div class="pq">${P.q}</div>
      ${P.speak && !canSpeak && P.autoSpeak ? `<div class="pq en">${P.speak}</div>` : ''}
      ${P.speak && canSpeak ? `<button class="pbtn sm blue" id="spkBtn">🔊 ${P.autoSpeak ? '다시 듣기' : '듣기'}</button>` : ''}
      ${P.vis ? `<div class="pvis">${P.vis}</div>` : ''}
      ${choicesHTML}
      ${S.timer ? '<div class="tbar"><i id="tbarI"></i></div>' : ''}<div class="pres" id="pres"></div>`);
    if (P.speak && canSpeak) {
      $('#spkBtn').onclick = () => speak(P.speak);
      if (P.autoSpeak) setTimeout(() => speak(P.speak), 350);
    }
    let done = false, tid = null;
    const btns = [...document.querySelectorAll('#mBody .choice')];
    const finish = i => {
      if (done) return; done = true; clearInterval(tid);
      const ok = sc ? i === true : i === P.ans;
      if (sc) { document.querySelectorAll('#mBody .chip').forEach(c => c.style.cursor = 'default'); $('#scReset').disabled = true; $('#scCheck').disabled = true; $('#scAns').style.background = ok ? '#c9f5d1' : '#ffd6d6'; }
      else btns.forEach((b, j) => { b.disabled = true; if (j === P.ans) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
      (ok ? SFX.ok : SFX.bad)();
      const answer = sc ? P.answer : P.choices[P.ans];
      $('#pres').innerHTML = (ok ? '⭕ 정답이에요!' : ((i === -1) ? '⏰ 시간이 끝났어요!' : '❌ 아쉬워요!') + ` 정답은 <span style="color:#1d9c4a">${answer}</span>`)
        + (P.exp ? `<div style="font-size:16px;opacity:.85;margin-top:4px">💡 ${P.exp}</div>` : '');
      const bt = $('#mBtns'); bt.innerHTML = '';
      const el = document.createElement('button');
      el.className = 'pbtn gold'; el.textContent = '확인';
      const close = () => { closeModal(); res(ok); };
      el.onclick = close; bt.appendChild(el);
      modalKey = key => { if (key === 'Enter' || key === ' ') close(); };
    };
    if (sc) {
      let pool = P.words.map((w, id) => ({ w, id })), placed = [];
      const draw = () => {
        $('#scPool').innerHTML = pool.map(x => `<span class="chip" data-id="${x.id}">${x.w}</span>`).join('');
        $('#scAns').innerHTML = placed.length ? placed.map(x => `<span class="chip" data-id="${x.id}">${x.w}</span>`).join('') : '<span class="hint">아래 단어를 순서대로 눌러 문장을 만드세요</span>';
        $('#scPool').querySelectorAll('.chip').forEach(c => c.onclick = () => { if (done) return; const x = pool.find(p => p.id === +c.dataset.id); pool = pool.filter(p => p !== x); placed.push(x); SFX.step(); draw(); });
        $('#scAns').querySelectorAll('.chip').forEach(c => c.onclick = () => { if (done) return; const x = placed.find(p => p.id === +c.dataset.id); placed = placed.filter(p => p !== x); pool.push(x); draw(); });
        $('#scCheck').disabled = pool.length > 0 || done;
      };
      $('#scReset').onclick = () => { if (done) return; pool = pool.concat(placed); placed = []; draw(); };
      $('#scCheck').onclick = () => finish(placed.map(x => x.w).join(' ') === P.answer);
      draw();
      modalKey = key => { if (key === 'Enter' && !$('#scCheck').disabled) $('#scCheck').click(); };
    } else {
      btns.forEach((b, i) => b.onclick = () => finish(i));
      modalKey = key => { if (key.length === 1 && '1234'.includes(key)) finish(+key - 1); };
    }
    if (S.timer) {
      const st = Date.now();
      tid = setInterval(() => {
        const left = 1 - (Date.now() - st) / (S.timer * 1000);
        const bar = $('#tbarI'); if (bar) bar.style.width = Math.max(0, left * 100) + '%';
        if (left <= 0) finish(-1);
      }, 100);
    }
  });
}
document.addEventListener('keydown', e => {
  if (modalOpen()) { if (modalKey) { e.preventDefault(); modalKey(e.key); } return; }
  if ((e.key === ' ' || e.key === 'Enter') && $('#screen-game').classList.contains('active') && !$('#rollBtn').disabled) { e.preventDefault(); rollDice(); }
});

/* =========================================================
   돈 처리
   ========================================================= */
function gain(p, amt) { p.money += amt; floatMoney(p, amt); SFX.coin(); updateCards(); }
async function charge(p, amt, to) {
  if (amt <= 0) return;
  if (p.money < amt) await liquidate(p, amt);
  const paid = Math.min(p.money, amt);
  p.money -= paid; floatMoney(p, -paid);
  if (to === 'fund') { S.fund += paid; updateCenter(); }
  else if (to) { to.money += paid; floatMoney(to, paid); }
  SFX.coin(); updateCards();
  if (paid < amt) await goBankrupt(p);
}
async function liquidate(p, need) {
  const owned = S.tiles.filter(t => t.owner === p.id).sort((a, b) => assetVal(a) - assetVal(b)), sold = [];
  while (p.money < need && owned.length) {
    const t = owned.shift(), v = r10(assetVal(t) / 2);
    p.money += v; t.owner = null; t.level = 0; sold.push(`${t.name} (+${v})`);
  }
  if (sold.length) {
    renderBuildings(); updateCards();
    addLog(`💔 ${p.name}: 돈이 모자라 ${sold.join(', ')} 판매`);
    await info('💔 돈이 모자라요', `${josa(p.name, '은/는')} 땅을 반값에 팔았어요.<br><b>${sold.join(', ')}</b>`);
  }
}
async function goBankrupt(p) {
  p.bankrupt = true; p.money = 0;
  S.tiles.forEach(t => { if (t.owner === p.id) { t.owner = null; t.level = 0; } });
  renderBuildings(); updateCards(); SFX.bad();
  addLog(`😭 ${p.name} 파산!`);
  await info(`😭 ${p.name} 파산!`, '더 이상 낼 돈이 없어요. 응원단으로 함께해 주세요!');
  if (S.players.filter(x => !x.bankrupt).length <= 1) gameOver();
}

/* =========================================================
   이동
   ========================================================= */
async function paySalary(p) { gain(p, SALARY); toast(`🚩 ${p.name} 출발 통과! 월급 +${SALARY}`); addLog(`🚩 ${p.name} 월급 +${SALARY}`); }
async function moveSteps(p, n) {
  const dir = n > 0 ? 1 : -1;
  for (let i = 0; i < Math.abs(n); i++) {
    p.pos = (p.pos + dir + 32) % 32;
    placeToken(p); hop(p); SFX.step();
    await sleep(240);
    if (dir > 0 && p.pos === 0) await paySalary(p);
  }
}
async function flyTo(p, target, salary = true) {
  if (target === p.pos) return;
  const pass = salary && target < p.pos;
  const tk = $('#tok' + p.id);
  tk.classList.add('fly'); SFX.fly();
  p.pos = target; placeToken(p);
  await sleep(800);
  tk.classList.remove('fly');
  if (pass || (salary && target === 0)) await paySalary(p);
}
async function goIsland(p) {
  await flyTo(p, 8, false);
  p.island = 2; S.doubles = 0; updateCards();
  addLog(`🏝️ ${p.name} 무인도에 갇힘`);
  await info('🏝️ 무인도에 도착!', `${josa(p.name, '은/는')} 무인도에 갇혔어요.<br>다음 차례부터 <b>탈출 문제</b>를 맞히면 나갈 수 있어요. (최대 2번 쉬기)`);
}
function flashTile(i) { const el = $('#tile' + i); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

/* =========================================================
   턴 진행
   ========================================================= */
async function startTurn() {
  if (S.over) return;
  S.doubles = 0; S.busy = true;
  $('#rollBtn').disabled = true;
  const p = curP(); updateCards();
  if (p.island > 0) {
    setMsg(`<b>${p.name}</b> 무인도 탈출 도전!`);
    await info('🏝️ 무인도 탈출 도전', `${p.char} ${josa(p.name, '은/는')} 무인도에 있어요. (남은 쉬기 ${p.island}번)<br>문제를 맞히면 바로 주사위를 굴릴 수 있어요!`, '문제 풀기');
    const ok = await askProblem(randTopic(), 1, '🏝️ 탈출 문제', '맞히면 탈출!');
    if (ok) { p.island = 0; addLog(`🛶 ${p.name} 무인도 탈출`); toast('🛶 탈출 성공!'); updateCards(); return readyRoll(); }
    p.island--; updateCards();
    toast(p.island ? `🏝️ 한 번 더 쉬어요` : '🏝️ 다음 차례에는 나갈 수 있어요');
    await sleep(600);
    return endTurn();
  }
  readyRoll();
}
function readyRoll(again) {
  if (S.over) return;
  const p = curP();
  S.busy = false; $('#rollBtn').disabled = false;
  setMsg(again ? `<b>${p.name}</b> 한 번 더 굴려요!` : `<b>${p.name}</b> 차례예요! 주사위를 굴리세요`);
  updateCards();
}
async function rollDice() {
  if (!S || S.busy || S.over || modalOpen()) return;
  S.busy = true; $('#rollBtn').disabled = true;
  const p = curP(), a = R(1, 6), b = R(1, 6), dbl = a === b;
  setMsg(`<b>${p.name}</b> 주사위 굴리는 중...`);
  await animDice(a, b);
  addLog(`🎲 ${p.name}: ${a} + ${b} = ${a + b}${dbl ? ' (더블)' : ''}`);
  if (dbl && ++S.doubles >= 3) {
    toast('😵 더블 3번! 무인도로...');
    await goIsland(p);
    return endTurn();
  }
  await moveSteps(p, a + b);
  await landOn(p);
  if (S.over) return;
  if (p.bankrupt) return endTurn();
  if (S.extraRoll) { S.extraRoll = false; toast('⏩ 한 번 더!'); return readyRoll(true); }
  if (dbl && p.island === 0) { toast('🎲 더블! 한 번 더 굴려요'); return readyRoll(true); }
  endTurn();
}
function endTurn() {
  if (S.over) return;
  const alive = S.players.filter(p => !p.bankrupt);
  if (alive.length <= 1) return gameOver();
  let n = S.cur;
  do { n = (n + 1) % S.players.length; } while (S.players[n].bankrupt);
  if (n <= S.cur) {
    S.round++;
    if (S.rounds && S.round > S.rounds) { updateCenter(); return gameOver(); }
    toast(`🔔 라운드 ${S.round} 시작`);
  }
  S.cur = n; updateCenter();
  startTurn();
}

/* ---------- 칸 도착 ---------- */
async function landOn(p) {
  if (S.over || p.bankrupt) return;
  const t = S.tiles[p.pos];
  flashTile(p.pos); updateCards();
  setMsg(`<b>${p.name}</b> · ${t.name} 도착!`);
  await sleep(250);
  if (t.type === 'city') return cityEvent(p, t);
  if (t.type === 'key') return goldenKey(p);
  if (t.type === 'island') {
    p.island = 2; updateCards(); addLog(`🏝️ ${p.name} 무인도 도착`);
    return info('🏝️ 무인도에 도착!', '다음 차례부터 탈출 문제를 맞히면 나갈 수 있어요. (최대 2번 쉬기)');
  }
  if (t.type === 'fund') {
    if (S.fund > 0) {
      const f = S.fund; S.fund = 0; updateCenter(); gain(p, f); addLog(`💰 ${p.name} 기금 ${f} 받음`);
      return info('💰 기금 당첨!', `${josa(p.name, '이/가')} 모인 기금 <b>${f}</b>을 모두 받았어요!`);
    }
    return info('💰 기금', '아직 기금이 비어 있어요.');
  }
  if (t.type === 'space') return spaceTravel(p);
}

async function cityEvent(p, t) {
  const T = GAME.topics[t.topic];
  if (t.owner === null) {
    const ok = await askProblem(t.topic, t.k, `🏙️ ${t.name} · 땅 사기 문제`, `맞히면 ${t.price}에 살 수 있어요`);
    if (!ok) { addLog(`❌ ${p.name}: ${t.name} 문제 실패`); return; }
    if (p.money < t.price) return info('🪙 돈이 모자라요', `${t.name}의 값은 ${t.price}인데 가진 돈이 ${p.money}뿐이에요.`);
    const c = await choose(`🏙️ ${josa(t.name, '을/를')} 살까요?`, `${T.icon} ${topicName(t.topic)} 도시 · 가격 <b>${t.price}</b><br>통행료 ${r10(t.price * TOLL_MULT[1])}부터 시작해요. (가진 돈 ${p.money})`, [['🚩 살게요!', 'gold'], ['그냥 지나가기', 'white']]);
    if (c === 0) {
      p.money -= t.price; floatMoney(p, -t.price); t.owner = p.id; t.level = 1; SFX.build();
      renderBuildings(); updateCards(); addLog(`🚩 ${p.name}: ${t.name} 구입 (${t.price})`);
      if (hasMonopoly(t)) { toast(`⭐ ${p.name} ${topicName(t.topic)} 도시 독점! 통행료 2배`); }
    }
    return;
  }
  if (t.owner === p.id) {
    if (t.level >= 4) return info('🏨 최고 단계!', `${t.name}에는 이미 호텔이 있어요.`);
    const cost = buildCost(t), nx = t.level + 1, newToll = r10(t.price * TOLL_MULT[nx] * (hasMonopoly(t) ? 2 : 1));
    const plan = `${LV_ICON[t.level]} ${LV_NAME[t.level]} → ${LV_ICON[nx]} <b>${LV_NAME[nx]}</b><br>짓는 값 <b>${cost}</b> · 통행료 ${tollOf(t)} → <b>${newToll}</b>`;
    if (p.money < cost) return info('🪙 돈이 모자라요', `우리 팀 땅 ${t.name}에 ${LV_NAME[nx]}을 지으려면 ${cost}이 필요해요.<br>(가진 돈 ${p.money})`);
    const go = await choose(`🏗️ 우리 땅 ${t.name}! 다음 건물을 지을 수 있어요`, `${plan}<br><small>문제를 맞히면 지을 수 있어요. (가진 돈 ${p.money})</small>`, [['📝 문제 풀고 짓기', 'gold'], ['다음에', 'white']]);
    if (go !== 0) return;
    const ok = await askProblem(t.topic, t.k, `🏗️ ${t.name} · 건물 짓기 문제`, `맞히면 ${LV_ICON[nx]} ${LV_NAME[nx]}을 지을 수 있어요`);
    if (!ok) { addLog(`❌ ${p.name}: ${t.name} 건물 짓기 문제 실패`); return info('😢 아쉬워요', `이번에는 ${LV_NAME[nx]}을 짓지 못했어요.<br>다음에 ${t.name}에 오면 다시 도전할 수 있어요!`); }
    const c = await choose(`${LV_ICON[nx]} ${LV_NAME[nx]}을 지을까요?`, plan, [['🏗️ 지을게요!', 'gold'], ['다음에', 'white']]);
    if (c === 0) {
      p.money -= cost; floatMoney(p, -cost); t.level = nx; SFX.build();
      renderBuildings(); updateCards(); addLog(`🏗️ ${p.name}: ${t.name}에 ${LV_NAME[nx]} 건설`);
    }
    return;
  }
  const owner = S.players[t.owner];
  let toll = tollOf(t);
  if (p.shield > 0) {
    p.shield--; updateCards(); addLog(`🛡️ ${p.name}: 방어권으로 통행료 면제`);
    await info('🛡️ 방어권 사용!', `${owner.name}의 땅이지만 통행료를 내지 않아요.`);
    if (t.level >= 4) return toast(`🏨 ${t.name}에는 호텔이 있어 인수할 수 없어요`);
    if (p.money < takeoverCost(t)) return toast(`🤝 ${t.name} 인수 값 ${takeoverCost(t)} · 돈이 모자라요`);
    const tk = await askProblem(t.topic, t.k, `🤝 ${t.name} · 인수 도전 문제`, `맞히면 ${takeoverCost(t)}에 인수할 수 있어요`);
    if (tk) await takeover(p, owner, t);
    return;
  }
  const ok = await askProblem(t.topic, t.k, `💸 ${owner.name}의 ${t.name}`, `통행료 ${toll}${hasMonopoly(t) ? ' (독점 2배)' : ''} · 맞히면 절반만!`);
  const full = toll;
  if (ok) toll = r10(toll / 2);
  addLog(`💸 ${p.name} → ${owner.name}: 통행료 ${toll}`);
  await showToll(p, owner, t, full, toll, ok);
  await charge(p, toll, owner);
  if (ok && !p.bankrupt) await takeover(p, owner, t);
}

async function takeover(p, owner, t) {
  if (t.level >= 4) { toast(`🏨 ${t.name}에는 호텔이 있어 인수할 수 없어요`); return; }
  const cost = takeoverCost(t);
  if (p.money < cost) { toast(`🤝 ${t.name} 인수 값 ${cost} · 돈이 모자라요`); return; }
  const c = await choose(`🤝 ${josa(t.name, '을/를')} 인수할까요?`,
    `정답을 맞혀서 인수 기회가 생겼어요!<br>인수 값 <b>🪙 ${cost}</b> → ${owner.name}에게 줘요.<br>${LV_ICON[t.level]} ${LV_NAME[t.level]}까지 그대로 우리 팀 땅이 돼요.<br><small>(가진 돈 ${p.money} · 호텔이 있는 땅은 인수할 수 없어요)</small>`,
    [['🤝 인수할게요!', 'gold'], ['그냥 지나가기', 'white']]);
  if (c !== 0) return;
  const pc = $('#pc' + p.id), oc = $('#pc' + owner.id);
  flyCoins(pc, oc, Math.max(3, Math.min(10, Math.round(cost / 60))));
  p.money -= cost; owner.money += cost; floatMoney(p, -cost); floatMoney(owner, cost);
  t.owner = p.id; SFX.build(); SFX.coin();
  renderBuildings(); updateCards();
  toast(`🤝 ${p.name}, ${owner.name}의 ${josa(t.name, '을/를')} 인수!`);
  addLog(`🤝 ${p.name}: ${owner.name}의 ${t.name} 인수 (${cost})`);
  if (hasMonopoly(t)) toast(`⭐ ${p.name} ${topicName(t.topic)} 도시 독점! 통행료 2배`);
  await sleep(600);
  const nx = t.level + 1, bc = buildCost(t);
  if (nx > 4 || p.money < bc) return;
  const b = await choose(`${LV_ICON[nx]} 바로 ${LV_NAME[nx]}을 지을까요?`,
    `인수한 땅에는 문제 없이 바로 지을 수 있어요.<br>짓는 값 <b>${bc}</b> → 통행료 ${r10(t.price * TOLL_MULT[nx] * (hasMonopoly(t) ? 2 : 1))} (가진 돈 ${p.money})`,
    [['🏗️ 지을게요!', 'gold'], ['다음에', 'white']]);
  if (b !== 0) return;
  p.money -= bc; floatMoney(p, -bc); t.level = nx; SFX.build();
  renderBuildings(); updateCards(); addLog(`🏗️ ${p.name}: ${t.name}에 ${LV_NAME[nx]} 건설`);
}

function tweenMoney(p, from, to, ms) {
  const el = $('#pc' + p.id + ' .pn'), t0 = performance.now();
  if (!el) return;
  const step = now => {
    const k = Math.min(1, (now - t0) / ms), v = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
    el.textContent = '🪙 ' + v;
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function flyCoins(fromEl, toEl, n) {
  if (!fromEl || !toEl) return;
  const a = fromEl.getBoundingClientRect(), b = toEl.getBoundingClientRect();
  const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
  const lift = Math.min(160, Math.abs(x1 - x0) * .3 + 60);
  for (let i = 0; i < n; i++) {
    setTimeout(() => {
      const c = document.createElement('div');
      c.className = 'coinFly'; c.textContent = '🪙';
      document.body.appendChild(c);
      const jx = (Math.random() - .5) * 40, jy = (Math.random() - .5) * 20;
      const anim = c.animate([
        { left: x0 + 'px', top: y0 + 'px', transform: 'scale(.6) rotate(0deg)' },
        { left: (x0 + x1) / 2 + jx + 'px', top: Math.max(20, Math.min(y0, y1) - lift + jy) + 'px', transform: 'scale(1.3) rotate(200deg)', offset: .5 },
        { left: x1 + 'px', top: y1 + 'px', transform: 'scale(.7) rotate(400deg)' }
      ], { duration: 750, easing: 'ease-in-out' });
      anim.onfinish = () => { c.remove(); SFX.clink(); };
    }, i * 90);
  }
}
async function showToll(p, owner, t, full, toll, ok) {
  const fx = $('#tollFx'), box = document.createElement('div');
  const mono = hasMonopoly(t);
  const calc = ok
    ? `정답! 절반만 내요 &nbsp;<s>${full}</s> → <b>${toll}</b>`
    : `오답이라 모두 내요`;
  box.className = 'tollBox';
  box.innerHTML = `<div class="tt">💸 통행료 · ${LV_ICON[t.level]} ${t.name}${mono ? ' ⭐독점 2배' : ''}</div>
    <div class="who"><span class="tm" style="background:${p.c}">${p.char} ${p.name}</span><span class="arr">➡️</span><span class="tm" style="background:${owner.c}">${owner.char} ${owner.name}</span></div>
    <div class="amt">-0</div><div class="calc">${calc}</div>`;
  fx.appendChild(box); SFX.toll();
  const amt = box.querySelector('.amt'), t0 = performance.now();
  const count = now => {
    const k = Math.min(1, (now - t0) / 600);
    amt.textContent = '-' + Math.round(toll * k);
    if (k < 1) requestAnimationFrame(count);
  };
  requestAnimationFrame(count);
  const tk = $('#tok' + p.id + ' .body'), pc = $('#pc' + p.id), oc = $('#pc' + owner.id);
  if (tk) { tk.classList.remove('shake'); void tk.offsetWidth; tk.classList.add('shake'); }
  [pc, oc].forEach(c => c.classList.remove('hit', 'got'));
  pc.classList.add('hit');
  flyCoins(tk || pc, oc, Math.max(3, Math.min(10, Math.round(toll / 40))));
  if (p.money >= toll) {
    tweenMoney(p, p.money, p.money - toll, 900);
    setTimeout(() => { oc.classList.add('got'); tweenMoney(owner, owner.money, owner.money + toll, 700); }, 700);
  }
  await sleep(1500);
  box.classList.add('bye');
  setTimeout(() => { box.remove(); pc.classList.remove('hit'); oc.classList.remove('got'); if (tk) tk.classList.remove('shake'); }, 400);
}

async function spaceTravel(p) {
  await info('🚀 우주여행!', '로켓을 타고 원하는 칸으로 갈 수 있어요.<br>보드에서 가고 싶은 칸을 눌러 주세요.<br><small>(출발 칸을 지나가면 월급도 받아요)</small>', '칸 고르기');
  const target = await pickTile(i => i !== 24);
  addLog(`🚀 ${p.name}: ${S.tiles[target].name}(으)로 우주여행`);
  await flyTo(p, target, true);
  await landOn(p);
}
let pickRes = null;
function pickTile(filter) {
  return new Promise(res => {
    S.tiles.forEach((_, i) => { if (filter(i)) $('#tile' + i).classList.add('pick'); });
    $('#pickBanner').classList.remove('hidden');
    pickRes = i => {
      if (!filter(i)) return;
      document.querySelectorAll('.tile.pick').forEach(e => e.classList.remove('pick'));
      $('#pickBanner').classList.add('hidden');
      pickRes = null; res(i);
    };
  });
}
function onTileClick(i) {
  if (pickRes) return pickRes(i);
  if (modalOpen()) return;
  const t = S.tiles[i];
  if (t.type !== 'city') {
    const desc = { start: `지나가거나 도착하면 월급 ${SALARY}을 받아요.`, island: '도착하면 무인도에 갇혀요. 탈출 문제를 맞히면 나갈 수 있어요.', fund: `모인 기금(${S.fund})을 모두 받아요.`, space: '원하는 칸으로 바로 날아가요.', key: '행운 또는 불운 카드를 뽑아요.' }[t.type];
    return info(`${t.icon} ${t.name}`, desc, '닫기');
  }
  const T = GAME.topics[t.topic], o = t.owner !== null ? S.players[t.owner] : null;
  info(`${T.icon} ${t.name}`, `<table class="tinfo" style="margin:0 auto">
    <tr><td>문제 주제</td><td>${topicName(t.topic)}</td></tr>
    <tr><td>땅값</td><td>${t.price}</td></tr>
    <tr><td>주인</td><td>${o ? `<b style="color:${o.c}">${o.char} ${o.id + 1}팀 ${o.name}</b>` : '없음'}</td></tr>
    <tr><td>건물</td><td>${o ? LV_ICON[t.level] + ' ' + LV_NAME[t.level] : '-'}</td></tr>
    <tr><td>통행료</td><td>${o ? tollOf(t) + (hasMonopoly(t) ? ' ⭐독점' : '') : '-'}</td></tr>
    <tr><td>인수 값</td><td>${o ? (t.level >= 4 ? '호텔이라 인수 불가' : takeoverCost(t)) : '-'}</td></tr>
    <tr><td>건물 짓는 값</td><td>${buildCost(t)}</td></tr></table>`, '닫기');
}

/* ---------- 황금열쇠 ---------- */
const CARDS = [
  { icon: '🎁', title: '용돈 받기', desc: '심부름을 잘했어요!<br>100을 받아요.', fn: async p => gain(p, 100) },
  { icon: '🧠', title: '보너스 도전 문제', desc: '어려운 문제를 맞히면<br>150을 받아요!', fn: async p => { if (await askProblem(randTopic(), 2, '🧠 보너스 도전 문제', '맞히면 +150')) gain(p, 150); } },
  { icon: '🚩', title: '출발로 이동', desc: '출발 칸으로 날아가서<br>월급을 받아요.', fn: async p => flyTo(p, 0, true) },
  { icon: '🏝️', title: '무인도로!', desc: '배가 고장 났어요.<br>무인도로 이동해요.', fn: async p => goIsland(p) },
  { icon: '🚀', title: '우주여행 초대권', desc: '우주여행 칸으로 이동해요.', fn: async p => { await flyTo(p, 24, true); await landOn(p); } },
  { icon: '👟', title: '앞으로 3칸', desc: '신나게 달려서<br>앞으로 3칸 가요.', fn: async p => { await moveSteps(p, 3); await landOn(p); } },
  { icon: '🔙', title: '뒤로 2칸', desc: '물건을 놓고 왔어요.<br>뒤로 2칸 가요.', fn: async p => { await moveSteps(p, -2); await landOn(p); } },
  { icon: '🎂', title: '생일 축하!', desc: '다른 모든 팀에게<br>30씩 선물을 받아요.', fn: async p => { for (const o of S.players) if (o !== p && !o.bankrupt) await charge(o, 30, p); } },
  { icon: '💸', title: '기금 내기', desc: '기금에 80을 내요.', fn: async p => charge(p, 80, 'fund') },
  { icon: '🛡️', title: '방어권', desc: '다음 한 번은<br>통행료를 내지 않아요.', fn: async p => { p.shield++; updateCards(); } },
  { icon: '🔧', title: '건물 수리비', desc: '내 건물 한 단계마다<br>20씩 기금에 내요.', fn: async p => {
      const n = S.tiles.filter(t => t.owner === p.id).reduce((s, t) => s + t.level - 1, 0);
      if (n > 0) await charge(p, 20 * n, 'fund'); else toast('건물이 없어서 낼 돈이 없어요!');
    } },
  { icon: '⏩', title: '한 번 더!', desc: '주사위를 한 번 더 굴려요.', fn: async () => { S.extraRoll = true; } },
  { icon: '🏗️', title: '무료 공사', desc: '내 땅 하나에 건물을<br>공짜로 한 단계 올려요.', fn: async p => {
      const t = S.tiles.filter(x => x.owner === p.id && x.level < 4).sort((a, b) => b.price - a.price)[0];
      if (t) { t.level++; SFX.build(); renderBuildings(); updateCards(); toast(`🏗️ ${t.name}에 ${LV_NAME[t.level]} 완성!`); }
      else { toast('지을 땅이 없어서 대신 50을 받아요'); gain(p, 50); }
    } },
  { icon: '🍀', title: '행운의 주사위', desc: '주사위가 짝수면 +100,<br>홀수면 기금에 50을 내요.', fn: async p => {
      const d = R(1, 6);
      await info('🍀 행운의 주사위', `<div style="font-size:60px">${'⚀⚁⚂⚃⚄⚅'[d - 1]}</div>${d}이 나왔어요! ${d % 2 ? '홀수라서 기금에 50을 내요.' : '짝수라서 100을 받아요!'}`);
      if (d % 2) await charge(p, 50, 'fund'); else gain(p, 100);
    } },
];
async function goldenKey(p) {
  if (!S.deck.length) S.deck = shuffle(CARDS.slice());
  const c = S.deck.pop();
  SFX.key(); addLog(`🔑 ${p.name}: ${c.title}`);
  await info('🔑 황금열쇠', `<div class="card3d"><div class="ci">${c.icon}</div><div class="ct">${c.title}</div><div class="cd">${c.desc}</div></div>`);
  await c.fn(p);
}

/* =========================================================
   끝내기 / 결과
   ========================================================= */
async function confirmEnd() {
  if (!S || S.over || modalOpen()) return;
  if (S.busy) { toast('진행 중인 차례가 끝난 뒤 눌러 주세요'); return; }
  const c = await choose('🏁 게임을 끝낼까요?', '지금까지의 재산으로 순위를 정해요.', [['끝내기', 'bad'], ['계속하기', 'white']]);
  if (c === 0) gameOver();
}
function gameOver() {
  if (S.over) return;
  S.over = true; S.busy = true;
  closeModal();
  const ranked = S.players.slice().sort((a, b) => (a.bankrupt - b.bankrupt) || (totalAssets(b) - totalAssets(a)));
  const medals = ['🥇', '🥈', '🥉', '4️⃣'];
  $('#rankList').innerHTML = ranked.map((p, i) => {
    const land = totalAssets(p) - p.money, cnt = S.tiles.filter(t => t.owner === p.id).length;
    return `<div class="rank-row" style="border-color:${p.c};background:${p.l}"><div class="md">${p.bankrupt ? '💀' : medals[i]}</div><div class="re">${p.char}</div>
      <div class="rn">${p.id + 1}팀 ${p.name}<div class="rv">현금 ${p.money} · 땅 ${cnt}개(${land})</div></div><div class="rt">${p.bankrupt ? '파산' : totalAssets(p)}</div></div>`;
  }).join('');
  setTimeout(() => { show('result'); SFX.win(); confetti(); }, 500);
}
function confetti() {
  const cols = PCOL.map(c => c.c).concat('#c3a3ff');
  for (let i = 0; i < 80; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random() * 100 + 'vw'; d.style.background = pick(cols);
    d.style.animationDuration = (2 + Math.random() * 2.5) + 's'; d.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 5500);
  }
}

/* ---------- 기록 / 규칙 ---------- */
function showLog() {
  if (modalOpen() || !S) return;
  info('📜 게임 기록', `<ol class="loglist">${S.log.slice().reverse().map(l => `<li>${l}</li>`).join('')}</ol>`, '닫기');
}

  const lv = S ? S.level : setup.level;
  info('📖 게임 방법', `<div class="rules">
    <h4>🎲 기본 진행</h4><ul>
      <li>최대 4팀이 차례대로 주사위 2개를 굴려 나온 수만큼 앞으로 가요.</li>
      <li>같은 수(더블)가 나오면 한 번 더! 더블이 3번 연속이면 무인도로 가요.</li>
      <li>출발 칸을 지나가면 월급 ${SALARY}을 받아요.</li></ul>
    <h4>🏙️ 도시 칸 (문제 풀기)</h4><ul>

    <h4>🎨 도시 색깔과 문제 주제</h4>
    <div class="legend">${GAME.groups.map(G => `<span><i style="background:${GAME.topics[G.topic].color}"></i>${GAME.topics[G.topic].icon} ${GAME.topicName(G.topic, lv)}</span>`).join('')}</div>
    <div class="hint" style="margin-top:4px">${GAME.rulesNote}</div>
    <h4>✨ 특별한 칸</h4><ul>

      <li>💰 <b>기금</b>: 모인 기금을 모두 받아요.</li>
      <li>🚀 <b>우주여행</b>: 원하는 칸으로 날아가요.</li></ul>
    <h4>🏆 승리</h4><ul>
      <li>돈이 모자라면 땅을 반값에 팔고, 그래도 모자라면 파산해요.</li>
      <li>정한 라운드가 끝나면 <b>재산(현금 + 땅과 건물 값)</b>이 가장 많은 팀이 이겨요.</li></ul>
    <h4>⌨️ 단축키</h4><ul><li>스페이스바: 주사위 굴리기 · 1~4: 보기 고르기 · Enter: 확인</li>
      <li>⟲ ⟳ 버튼으로 보드를 돌려 볼 수 있어요. 칸을 누르면 정보를 볼 수 있어요.</li></ul></div>`, '알겠어요!');
